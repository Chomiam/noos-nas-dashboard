name: "Build Package"

on:
  push:
    branches:
      - stable
      - testing
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: ⚡ Configuration Cachix (steveos)
        uses: cachix/cachix-action@v17
        with:
          name: steveos
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      - name: Build Package
        run: nix build .#default --print-out-paths
